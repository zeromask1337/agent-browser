<!doctype html>
<html>
  <head><title>Workspace settings</title></head>
  <body>
    <main>
      <h1>Workspace settings</h1>
      <section>
        <h2>Display</h2>
        <label for="density">Row density</label>
        <select id="density">
          <option>Comfortable</option>
          <option>Compact</option>
        </select>
        <button type="button">Save changes</button>
        <button type="button">Discard changes</button>
      </section>
      <section>
        <h2>Notifications</h2>
        <label for="digest">Digest frequency</label>
        <select id="digest">
          <option>Daily</option>
          <option>Weekly</option>
        </select>
        <button type="button">Save notification settings</button>
      </section>
      <a href="/workspace/export">Export workspace data</a>
    </main>
  </body>
</html>
