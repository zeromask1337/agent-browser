<!doctype html>
<html>
  <head><title>Edit profile</title></head>

    <header>
      <a href="/support">Support</a>
      <a href="/overview">Back</a>
    </header>
    <main>
      <h1>Edit profile</h1>
      <label for="display">Display name</label>
      <input id="display" type="text">
      <label for="contact">Contact email</label>
      <input id="contact" type="email">
      <button type="button">Save</button>
      <button type="button">Save and publish</button>
      <section>
        <h2>Wizard</h2>
        <a href="/wizard/step-2">Next step</a>
      </section>
      <section>
        <h2>Customer comments</h2>
        <p>Page one of the comment history.</p>
        <a href="/comments/1">Previous</a>
        <a href="/comments/3">Next</a>
      </section>
      <label for="pace">Delivery speed</label>
      <select id="pace">
        <option>Standard</option>
        <option>Express</option>
      </select>
      <button type="button">Cancel</button>
      <div style="height: 1400px">Profile history</div>
    </main>
  </body>
</html>
