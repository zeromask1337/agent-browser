<!doctype html>
<html>
  <head><title>Gift order</title></head>
  <body>
    <header><a href="/basket">Basket</a></header>
    <main>
      <h1>Gift order</h1>
      <label for="recipient">Recipient name</label>
      <input id="recipient" type="text">
      <label for="wrap">Gift wrap</label>
      <select id="wrap">
        <option>None</option>
        <option>Recycled paper</option>
        <option>Linen box</option>
      </select>
      <label for="message">Gift message</label>
      <input id="message" type="text">
      <button type="button">Add gift options</button>
      <button type="button">Continue to payment</button>
      <a href="/terms">Terms</a>
    </main>
  </body>
</html>
