<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Juniper museum tickets</title>
  </head>
  <body>
    <nav>
      <a href="/visit">Visit</a>
      <a href="/exhibits">Exhibits</a>
      <a href="/membership">Membership</a>
    </nav>
    <h1>Plan your museum visit</h1>
    <label for="q20">Visit date</label>
    <input id="q20" type="text">
    <label for="q21">Ticket type</label>
    <select id="q21">
          <option>Adult</option>
          <option>Child</option>
          <option>Senior</option>
          <option>Student</option>
        </select>
    <label for="q22">Entry time</label>
    <select id="q22">
          <option>10:00</option>
          <option>12:00</option>
          <option>14:00</option>
        </select>
    <label for="q23">Gallery add-on</label>
    <select id="q23">
          <option>None</option>
          <option>Special exhibition</option>
          <option>Sculpture garden</option>
        </select>
    <label for="q24">Group size</label>
    <input id="q24" type="text">
    <input id="q25" type="checkbox">
    <label for="q25">Wheelchair access</label>
    <input id="q26" type="checkbox">
    <label for="q26">Audio guide</label>
    <button>Add to basket</button>
    <a href="/calendar">Exhibit calendar</a>
    <a href="/accessibility">Accessibility map</a>
    <div style="height: 2200px"> </div>
    <button>Buy membership</button>
  </body>
</html>
