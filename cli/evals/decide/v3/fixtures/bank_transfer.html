<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northline bank transfer</title>
  </head>
  <body>
    <nav>
      <a href="/accounts">Accounts</a>
      <a href="/payees">Payees</a>
      <a href="/statements">Statements</a>
    </nav>
    <h1>Transfer money</h1>
    <form>
      <label for="q39">From account</label>
      <select id="q39">
          <option>Checking</option>
          <option>Savings</option>
          <option>Joint checking</option>
        </select>
      <label for="q40">To payee</label>
      <select id="q40">
          <option>Ada Rentals</option>
          <option>City Utilities</option>
          <option>Nora Chen</option>
        </select>
      <label for="q41">Amount</label>
      <input id="q41" type="text">
      <label for="q42">Transfer date</label>
      <input id="q42" type="text">
      <label for="q43">Frequency</label>
      <select id="q43">
          <option>One time</option>
          <option>Weekly</option>
          <option>Monthly</option>
        </select>
      <label for="q44">Memo</label>
      <textarea id="q44" rows="3"></textarea>
      <input id="q45" type="checkbox">
      <label for="q45">Send email receipt</label>
      <button>Review transfer</button>
    </form>
    <a href="/limits">Transfer limits</a>
    <a href="/fraud">Report fraud</a>
    <div style="height: 2100px"> </div>
    <button disabled>Confirm transfer</button>
  </body>
</html>
