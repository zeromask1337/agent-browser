<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riverside library catalog</title>
  </head>
  <body>
    <nav>
      <a href="/branches">Branches</a>
      <a href="/loans">My loans</a>
      <a href="/lists">Reading lists</a>
    </nav>
    <h1>Riverside library</h1>
    <label for="q1">Catalog search</label>
    <input id="q1" type="search">
    <button>Search catalog</button>
    <label for="q2">Genre</label>
    <select id="q2">
          <option>Any genre</option>
          <option>Mystery</option>
          <option>History</option>
          <option>Poetry</option>
        </select>
    <label for="q3">Format</label>
    <select id="q3">
          <option>Any format</option>
          <option>Large print</option>
          <option>Audiobook</option>
          <option>Ebook</option>
        </select>
    <label for="q4">Sort order</label>
    <select id="q4">
          <option>Relevance</option>
          <option>Newest</option>
          <option>Title</option>
        </select>
    <input id="q5" type="checkbox">
    <label for="q5">Available now</label>
    <input id="q6" type="checkbox" disabled>
    <label for="q6">Include branch-only copies</label>
    <button>Reserve this item</button>
    <a href="/read">Read online</a>
    <a href="/hold">Place a hold</a>
    <button>Previous page</button>
    <button>Next page</button>
    <div style="height: 1900px"> </div>
    <a href="/hours">Branch hours</a>
  </body>
</html>
