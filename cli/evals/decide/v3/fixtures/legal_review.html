<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quill legal review</title>
  </head>
  <body>
    <nav>
      <a href="/matters">Matters</a>
      <a href="/contracts">Contracts</a>
      <a href="/deadlines">Deadlines</a>
    </nav>
    <h1>Contract review</h1>
    <label for="q68">Search contracts</label>
    <input id="q68" type="search">
    <button>Find contracts</button>
    <label for="q69">Matter</label>
    <select id="q69">
          <option>Harbor lease</option>
          <option>Ridge supply</option>
          <option>Depot sale</option>
        </select>
    <label for="q70">Reviewer</label>
    <select id="q70">
          <option>Unassigned</option>
          <option>Anika Rao</option>
          <option>Tom Bell</option>
        </select>
    <label for="q71">Priority</label>
    <select id="q71">
          <option>Low</option>
          <option>Normal</option>
          <option>High</option>
        </select>
    <label for="q72">Review note</label>
    <textarea id="q72" rows="3"></textarea>
    <input id="q73" type="checkbox">
    <label for="q73">Flag for partner review</label>
    <button>Approve clause</button>
    <button>Reject clause</button>
    <a href="/redlines">Redline history</a>
    <a href="/clauses">Clause library</a>
    <div style="height: 2000px"> </div>
    <button>Send to counterparty</button>
  </body>
</html>
