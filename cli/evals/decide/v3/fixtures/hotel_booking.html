<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lantern hotel booking</title>
  </head>
  <body>
    <nav>
      <a href="/rooms">Rooms</a>
      <a href="/offers">Offers</a>
      <a href="/reservations">Reservations</a>
    </nav>
    <h1>Book a room</h1>
    <label for="q32">Check-in</label>
    <input id="q32" type="text">
    <label for="q33">Check-out</label>
    <input id="q33" type="text">
    <label for="q34">Guests</label>
    <select id="q34">
          <option>1 adult</option>
          <option>2 adults</option>
          <option>2 adults and 1 child</option>
        </select>
    <label for="q35">Room type</label>
    <select id="q35">
          <option>Standard</option>
          <option>Deluxe</option>
          <option>Suite</option>
        </select>
    <label for="q36">Bed preference</label>
    <select id="q36">
          <option>King</option>
          <option>Two queens</option>
        </select>
    <input id="q37" type="checkbox">
    <label for="q37">Breakfast included</label>
    <label for="q38">Promo code</label>
    <input id="q38" type="text">
    <button>Check availability</button>
    <a href="/policy">Cancellation policy</a>
    <a href="/nearby">Nearby restaurants</a>
    <div style="height: 2300px"> </div>
    <button>Book now</button>
  </body>
</html>
