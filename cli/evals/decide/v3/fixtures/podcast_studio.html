<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Waveform podcast studio</title>
  </head>
  <body>
    <nav>
      <a href="/episodes">Episodes</a>
      <a href="/guests">Guests</a>
      <a href="/analytics">Analytics</a>
    </nav>
    <h1>Episode editor</h1>
    <label for="q62">Episode title</label>
    <input id="q62" type="text">
    <label for="q63">Show</label>
    <select id="q63">
          <option>Field Notes</option>
          <option>Signal Path</option>
          <option>After Hours</option>
        </select>
    <label for="q64">Season</label>
    <select id="q64">
          <option>Season 1</option>
          <option>Season 2</option>
          <option>Season 3</option>
        </select>
    <label for="q65">Visibility</label>
    <select id="q65">
          <option>Draft</option>
          <option>Private</option>
          <option>Public</option>
        </select>
    <label for="q66">Show notes</label>
    <textarea id="q66" rows="3"></textarea>
    <input id="q67" type="checkbox">
    <label for="q67">Publish to RSS</label>
    <button>Upload audio</button>
    <button>Save episode</button>
    <a href="/transcript">Transcript editor</a>
    <a href="/cover">Cover art</a>
    <div style="height: 2100px"> </div>
    <button>Schedule release</button>
  </body>
</html>
