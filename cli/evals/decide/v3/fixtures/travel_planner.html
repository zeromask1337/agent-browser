<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Waypoint travel planner</title>
  </head>
  <body>
    <nav>
      <a href="/trips">Trips</a>
      <a href="/flights">Flights</a>
      <a href="/lodging">Lodging</a>
    </nav>
    <h1>Trip itinerary</h1>
    <label for="q74">Destination</label>
    <input id="q74" type="search">
    <label for="q75">Travel dates</label>
    <input id="q75" type="text">
    <label for="q76">Travelers</label>
    <select id="q76">
          <option>1 traveler</option>
          <option>2 travelers</option>
          <option>Family of four</option>
        </select>
    <label for="q77">Budget</label>
    <select id="q77">
          <option>Economy</option>
          <option>Balanced</option>
          <option>Comfort</option>
        </select>
    <label for="q78">Transport</label>
    <select id="q78">
          <option>Any</option>
          <option>Train</option>
          <option>Flight</option>
          <option>Car</option>
        </select>
    <input id="q79" type="checkbox">
    <label for="q79">Direct routes only</label>
    <button>Build itinerary</button>
    <a href="/packing">Packing list</a>
    <a href="/visa">Visa requirements</a>
    <div style="height: 2300px"> </div>
    <button>Share trip</button>
  </body>
</html>
