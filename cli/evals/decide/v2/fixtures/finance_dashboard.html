<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Treasury overview</title>
  </head>
  <body>
    <nav>
      <a href="/transactions">View all transactions</a>
      <a href="/statement">Download statement</a>
      <a href="/support">Support</a>
    </nav>
    <h1>Treasury overview</h1>
    <button role="tab">Overview</button>
    <button role="tab">Statements</button>
    <label for="f43">Date range</label>
    <select id="f43">
          <option>Last 7 days</option>
          <option>Last 30 days</option>
          <option>This quarter</option>
        </select>
    <label for="f44">Account</label>
    <select id="f44">
          <option>Checking</option>
          <option>Savings</option>
          <option>Reserve</option>
        </select>
    <label for="f45">Transaction type</label>
    <select id="f45">
          <option>All</option>
          <option>Debit</option>
          <option>Credit</option>
        </select>
    <label for="f46">Search transactions</label>
    <input id="f46" type="search">
    <label for="f47">Memo</label>
    <input id="f47" type="text">
    <label for="f48">Payee</label>
    <input id="f48" type="text">
    <button>Refresh data</button>
    <button>Export CSV</button>
    <button>Add transaction</button>
    <button>Previous</button>
    <button>Next</button>
    <a href="/budget">View budget</a>
    <div style="height: 2800px"> </div>
  </body>
</html>
