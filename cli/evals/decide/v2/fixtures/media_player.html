<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Field recordings</title>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/subscriptions">Subscriptions</a>
    </nav>
    <h1>Field recordings</h1>
    <label for="f49">Search videos</label>
    <input id="f49" type="search">
    <label for="f50">Search playlists</label>
    <input id="f50" type="search">
    <label for="f51">Comment</label>
    <textarea id="f51" rows="3"></textarea>
    <label for="f52">Quality</label>
    <select id="f52">
          <option>Auto</option>
          <option>720p</option>
          <option>1080p</option>
        </select>
    <label for="f53">Audio track</label>
    <select id="f53">
          <option>English</option>
          <option>Spanish</option>
        </select>
    <label for="f54">Playback speed</label>
    <select id="f54">
          <option>0.5x</option>
          <option>1x</option>
          <option>1.5x</option>
        </select>
    <button>Play</button>
    <button>Pause</button>
    <button>Mute</button>
    <button>Fullscreen</button>
    <button>Like</button>
    <input id="f55" type="checkbox">
    <label for="f55">Autoplay next video</label>
    <a href="/playlist">Save to playlist</a>
    <a href="/share">Share</a>
    <a href="/report">Report</a>
    <div style="height: 2600px"> </div>
  </body>
</html>
