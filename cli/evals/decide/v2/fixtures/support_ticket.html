<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

  </head>
  <body>
    <nav>
      <a href="/tickets">Back to tickets</a>

    <h1>Ticket 4821</h1>
    <label for="f77">Subject</label>
    <input id="f77" type="text">
    <label for="f78">Description</label>
    <textarea id="f78" rows="3"></textarea>
    <label for="f79">Customer email</label>

    <label for="f80">Search tickets</label>
    <input id="f80" type="search">

          <option>Low</option>

          <option>High</option>
          <option>Urgent</option>
        </select>

          <option>Open</option>
          <option>Pending</option>

        </select>

          <option>Unassigned</option>
          <option>Me</option>
          <option>Team lead</option>
        </select>
    <input id="f84" type="checkbox">
    <label for="f84">Notify customer</label>
    <button>Save</button>
    <button>Send reply</button>
    <button>Close ticket</button>
    <button>Attach file</button>

    <div style="height: 2600px"> </div>
