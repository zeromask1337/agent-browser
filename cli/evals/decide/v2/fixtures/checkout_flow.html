<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/cart">Cart</a>
    </nav>
    <h1>Checkout</h1>
    <form>
      <label for="f13">Full name</label>
      <input id="f13" type="text">
      <label for="f14">Street address</label>
      <input id="f14" type="text">
      <label for="f15">City</label>
      <input id="f15" type="text">
      <label for="f16">Country</label>
      <select id="f16">
          <option>United States</option>
          <option>Canada</option>
          <option>Germany</option>
        </select>
      <label for="f17">Delivery speed</label>
      <select id="f17">
          <option>Standard</option>
          <option>Express</option>
        </select>
      <label for="f18">Payment method</label>
      <select id="f18">
          <option>Card</option>
          <option>PayPal</option>
          <option>Bank transfer</option>
        </select>
      <label for="f19">Coupon code</label>
      <input id="f19" type="text">
      <button>Apply coupon</button>
      <input id="f20" type="checkbox">
      <label for="f20">Same as billing</label>
      <button>Place order</button>
    </form>
    <a href="/payment">Edit payment method</a>
    <a href="/support">Contact support</a>
    <a href="/cart">Return to cart</a>
    <a href="/shipping">View shipping policy</a>
    <div style="height: 2000px"> </div>
  </body>
</html>
