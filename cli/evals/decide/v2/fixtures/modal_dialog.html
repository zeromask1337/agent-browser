<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project workspace</title>
  </head>
  <body>
    <nav>
      <a href="/projects">Projects</a>
      <a href="/members">Manage members</a>
    </nav>
    <button>New project</button>
    <p>The invite dialog is open over the project list.</p>
    <div role="dialog" aria-label="Invite teammate">
    <h2>Invite teammate</h2>
    <label for="f65">Work email</label>
    <input id="f65" type="email">
    <label for="f66">Invite message</label>
    <textarea id="f66" rows="3"></textarea>
    <label for="f67">Search people</label>
    <input id="f67" type="search">
    <label for="f68">Permission</label>
    <select id="f68">
          <option>Can view</option>
          <option>Can edit</option>
          <option>Admin</option>
        </select>
    <label for="f69">Expires in</label>
    <select id="f69">
          <option>24 hours</option>
          <option>7 days</option>
          <option>30 days</option>
        </select>
    <label for="f70">Notify via</label>
    <select id="f70">
          <option>Email</option>
          <option>Slack</option>
        </select>
    <button>Send invite</button>
    <button>Cancel</button>
    <button>Copy invite link</button>
    <button>Close dialog</button>
    <a href="/permissions">Learn about permissions</a>
    <a href="/help">Open help</a>
    <a href="/upgrade">Upgrade plan</a>
    <a href="/billing">View billing</a>
    </div>
    <button>Dismiss banner</button>
    <div style="height: 2600px"> </div>
  </body>
</html>
