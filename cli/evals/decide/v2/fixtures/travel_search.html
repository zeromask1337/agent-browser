<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Waypoint travel</title>
  </head>
  <body>
    <nav>
      <a href="/booking">Manage booking</a>
      <a href="/signin">Sign in</a>
      <a href="/deals">Deals</a>
    </nav>
    <h1>Find a flight</h1>
    <form>
      <label for="f34">Origin</label>
      <input id="f34" type="text" placeholder="City or airport">
      <label for="f35">Destination</label>
      <input id="f35" type="text" placeholder="City or airport">
      <label for="f36">Depart date</label>
      <input id="f36" type="text" placeholder="YYYY-MM-DD">
      <label for="f37">Promo code</label>
      <input id="f37" type="text">
      <label for="f38">Passengers</label>
      <select id="f38">
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
        </select>
      <label for="f39">Cabin</label>
      <select id="f39">
          <option>Economy</option>
          <option>Premium</option>
          <option>Business</option>
        </select>
      <label for="f40">Stops</label>
      <select id="f40">
          <option>Any</option>
          <option>Nonstop</option>
          <option>One stop</option>
        </select>
      <input id="f41" type="checkbox">
      <label for="f41">Direct flights only</label>
      <input id="f42" type="checkbox">
      <label for="f42">Flexible dates</label>
      <button>Search flights</button>
    </form>
    <button>Next month</button>
    <button>Previous month</button>
    <a href="/alerts">Travel alerts</a>
    <div style="height: 2400px"> </div>
  </body>
</html>
