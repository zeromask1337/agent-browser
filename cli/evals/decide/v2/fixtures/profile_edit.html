<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit profile</title>
  </head>
  <body>
    <nav>
      <a href="/u/me">View public profile</a>
      <a href="/password">Change password</a>
    </nav>
    <h1>Edit profile</h1>
    <label for="f85">Display name</label>
    <input id="f85" type="text">
    <label for="f86">Contact email</label>
    <input id="f86" type="email">
    <label for="f87">Username</label>
    <input id="f87" type="text">
    <label for="f88">Bio</label>
    <textarea id="f88" rows="3"></textarea>
    <label for="f89">Time zone</label>
    <select id="f89">
          <option>UTC</option>
          <option>Europe/Lisbon</option>
          <option>America/Chicago</option>
        </select>
    <label for="f90">Language</label>
    <select id="f90">
          <option>English</option>
          <option>Portuguese</option>
          <option>German</option>
        </select>
    <label for="f91">Profile visibility</label>
    <select id="f91">
          <option>Public</option>
          <option>Connections</option>
          <option>Private</option>
        </select>
    <input id="f92" type="checkbox">
    <label for="f92">Show email on profile</label>
    <button>Save draft</button>
    <button>Save and publish</button>
    <button>Cancel</button>
    <a href="/photo/upload">Upload photo</a>
    <a href="/photo/remove">Remove photo</a>
    <a href="/privacy">Privacy settings</a>
    <div style="height: 2400px"> </div>
  </body>
</html>
