<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Northwind sign in</title>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/help">Help</a>
    </nav>
    <h1>Sign in to Northwind</h1>
    <p>Use your workspace account to continue.</p>
    <form>
      <label for="f1">Email address</label>
      <input id="f1" type="email" placeholder="you@example.com">
      <label for="f2">Password</label>
      <input id="f2" type="password">
      <input id="f3" type="checkbox">
      <label for="f3">Remember this device</label>
      <label for="f4">Region</label>
      <select id="f4">
          <option>United States</option>
          <option>Germany</option>
          <option>Japan</option>
        </select>
      <label for="f5">Language</label>
      <select id="f5">
          <option>English</option>
          <option>German</option>
          <option>Japanese</option>
        </select>
      <label for="f6">Time zone display</label>
      <select id="f6">
          <option>UTC</option>
          <option>Local time</option>
        </select>
      <button type="submit">Sign in</button>
    </form>
    <a href="/register">Create an account</a>
    <a href="/reset">Forgot password</a>
    <button>Continue with SSO</button>
    <a href="/passkey">Use a passkey</a>
    <a href="/privacy">Privacy policy</a>
    <div style="height: 1800px"> </div>
    <a href="/security">Security notice</a>
  </body>
</html>
