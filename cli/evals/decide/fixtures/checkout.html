<!doctype html>
<html>
  <head><title>Checkout</title></head>
  <body>
    <main>
      <h1>Checkout</h1>
      <label for="name">Full name</label>
      <input id="name" type="text">
      <label for="size">Shoe size</label>
      <select id="size">
        <option>40</option>
        <option>41</option>
        <option>42</option>
      </select>
      <label for="quantity">Quantity</label>
      <select id="quantity">
        <option>1</option>
        <option>2</option>
        <option>3</option>
      </select>
      <a href="/cart">Return to cart</a>
      <button>Place order</button>
    </main>
  </body>
</html>
