<!doctype html>
<html>
  <head><title>Trail Runner Store</title></head>
  <body>
    <header>
      <a href="/">Trail Runner</a>
      <input aria-label="Search products" type="search">
      <a href="/cart">Cart</a>
    </header>
    <main>
      <h1>Trail running shoes</h1>
      <label for="sort">Sort by</label>
      <select id="sort">
        <option>Relevance</option>
        <option>Price low to high</option>
        <option>Price high to low</option>
      </select>
      <label for="country">Ship to country</label>
      <select id="country">
        <option>United States</option>
        <option>Germany</option>
        <option>Japan</option>
      </select>
      <section>
        <h2>Ridge Runner 2</h2>
        <p>Trail shoe for rocky ground</p>
        <a href="/ridge-runner">View details</a>
        <button>Add to cart</button>
      </section>
      <section>
        <h2>Mudline GTX</h2>
        <p>Waterproof fell shoe</p>
        <a href="/mudline">View details</a>
        <button>Add to cart</button>
      </section>
      <label for="coupon">Coupon code</label>
      <input id="coupon" type="text">
      <button type="submit">Apply coupon</button>
    </main>
  </body>
</html>
